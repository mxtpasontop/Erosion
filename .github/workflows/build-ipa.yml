name: Build and release IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Test container metadata lookup
        run: |
          xcrun swiftc Erosion/FileManager/Helpers/InfoHelpers.swift \
            Tests/ContainerMetadataTests.swift -o "$RUNNER_TEMP/container-metadata-tests"
          "$RUNNER_TEMP/container-metadata-tests"

      - name: Install entitlement signer
        run: brew install ldid

      - name: Build IPA
        run: bash ipabuild.sh 2>&1 | tee "$RUNNER_TEMP/ipa-build.log"

      - name: Verify IPA layout
        run: |
          unzip -t Erosion.ipa
          unzip -Z1 Erosion.ipa > "$RUNNER_TEMP/ipa-contents.txt"
          grep -Fxq 'Payload/Erosion.app/Erosion' "$RUNNER_TEMP/ipa-contents.txt"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-ipa
          path: Erosion.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-log
          path: ${{ runner.temp }}/ipa-build.log
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Erosion-ipa

      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
            title="Erosion $tag"
            flags=(--verify-tag)
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            title="Erosion build ${GITHUB_RUN_NUMBER}"
            flags=(--prerelease --latest=false)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Erosion.ipa --clobber
          else
            gh release create "$tag" Erosion.ipa \
              --target "$COMMIT_SHA" --title "$title" \
              --notes "Automated IPA build from commit $COMMIT_SHA. Re-sign the IPA with your sideloading tool before installing." \
              "${flags[@]}"
          fi
